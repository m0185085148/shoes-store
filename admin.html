<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>لوحة التحكم - STEP Store</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f9;--side:#111827;--card:#fff;--blue:#2563eb;--text:#1f2937;--muted:#6b7280;--border:#e5e7eb;--danger:#ef4444}*{box-sizing:border-box;margin:0;padding:0;font-family:Tajawal,sans-serif}body{background:var(--bg);color:var(--text);display:flex;min-height:100vh}.sidebar{width:260px;background:var(--side);color:#fff;padding:24px 16px;display:flex;flex-direction:column;gap:32px}.brand{font-size:22px;font-weight:700;display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}.nav-menu{list-style:none;display:flex;flex-direction:column;gap:8px}.nav-item a{display:flex;align-items:center;gap:12px;padding:12px 16px;color:#9ca3af;text-decoration:none;border-radius:8px}.nav-item a:hover,.nav-item.active a{background:#1f2937;color:#fff}.main-content{flex:1;padding:32px;overflow-y:auto}.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.header h1{font-size:24px}.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-bottom:32px}.stat-card{background:var(--card);padding:20px;border-radius:12px;border:1px solid var(--border);display:flex;align-items:center;gap:16px}.stat-icon{width:48px;height:48px;border-radius:10px;background:#eff6ff;color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:20px}.stat-data h3{font-size:22px}.stat-data p{color:var(--muted);font-size:14px}.dashboard-grid{display:grid;grid-template-columns:1fr 390px;gap:24px}.panel{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:24px}.panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--border)}.panel-title{font-size:18px;font-weight:700}.form-group{margin-bottom:16px}.form-group label{display:block;margin-bottom:6px;font-size:14px;font-weight:500}.form-group input,.form-group select,.form-group textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;outline:none}.form-group textarea{min-height:100px;resize:vertical}.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--blue)}.btn-submit{width:100%;padding:12px;background:var(--blue);color:#fff;border:0;border-radius:8px;font-weight:700;cursor:pointer}.btn-submit:hover{background:#1d4ed8}.btn-submit:disabled{opacity:.6;cursor:not-allowed}.products-table{width:100%;border-collapse:collapse}.products-table th,.products-table td{padding:12px;text-align:right;border-bottom:1px solid var(--border);font-size:14px;vertical-align:middle}.products-table th{color:var(--muted);font-weight:500}.product-img-mini{width:48px;height:48px;border-radius:6px;object-fit:cover;background:#eee}.table-wrap{overflow:auto}.badge{padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;display:inline-block}.badge-casual{background:#e3f2fd;color:#0d47a1}.badge-sports{background:#e8f5e9;color:#1b5e20}.badge-classic{background:#fff3e0;color:#e65100}.badge-slides{background:#f3e5f5;color:#4a148c}.badge-default{background:#eee;color:#555}.category-select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:#fff}.message{padding:10px;border-radius:8px;margin-bottom:15px;display:none}.message.show{display:block}.message.success{background:#dcfce7;color:#166534}.message.error{background:#fee2e2;color:#991b1b}@media(max-width:1024px){body{flex-direction:column}.sidebar{width:100%}.dashboard-grid{grid-template-columns:1fr}}@media(max-width:600px){.main-content{padding:18px}.sidebar{padding:16px}.header h1{font-size:20px}.dashboard-grid{grid-template-columns:1fr}.panel{padding:16px}}
</style></head>
<body>
<aside class="sidebar"><a href="index.html" class="brand"><i class="fa-solid fa-shoe-prints"></i> STEP Admin</a><ul class="nav-menu"><li class="nav-item active"><a href="#"><i class="fa-solid fa-chart-pie"></i> لوحة التحكم</a></li><li class="nav-item"><a href="index.html" target="_blank"><i class="fa-solid fa-store"></i> معاينة المتجر</a></li></ul></aside>
<main class="main-content"><div class="header"><div><h1>إدارة المنتجات</h1><p style="color:var(--muted);font-size:14px;margin-top:4px">إضافة المنتجات إلى المتجر مباشرة</p></div></div>
<div id="message" class="message"></div>
<div class="stats-grid"><div class="stat-card"><div class="stat-icon"><i class="fa-solid fa-boxes-stacked"></i></div><div class="stat-data"><h3 id="statTotal">0</h3><p>إجمالي المنتجات</p></div></div><div class="stat-card"><div class="stat-icon"><i class="fa-solid fa-tags"></i></div><div class="stat-data"><h3 id="statCategories">4</h3><p>عدد الأقسام</p></div></div></div>
<div class="dashboard-grid"><div class="panel"><div class="panel-header"><span class="panel-title">المنتجات المعروضة</span></div><div class="table-wrap"><table class="products-table"><thead><tr><th>الصورة</th><th>الاسم</th><th>القسم</th><th>السعر</th></tr></thead><tbody id="adminProductsList"><tr><td colspan="4" style="text-align:center">جاري التحميل...</td></tr></tbody></table></div></div>
<div class="panel"><div class="panel-header"><span class="panel-title">إضافة صنف جديد</span></div><form id="addProductForm">
<div class="form-group"><label for="name">اسم الحذاء</label><input type="text" id="name" required placeholder="مثال: Nike Air Force"></div>
<div class="form-group"><label for="category">القسم</label><select id="category" class="category-select" required><option value="">اختر القسم</option><option value="Casual">Casual</option><option value="Sports">Sports</option><option value="Classic">Classic</option><option value="Slides">Slides</option></select></div>
<div style="display:flex;gap:10px"><div class="form-group" style="flex:1"><label for="price">السعر</label><input type="number" id="price" min="0" step="0.01" required></div><div class="form-group" style="flex:1"><label for="oldPrice">السعر القديم</label><input type="number" id="oldPrice" min="0" step="0.01"></div></div>
<div class="form-group"><label for="badge">الشارة</label><select id="badge"><option value="">بدون</option><option value="جديد">جديد</option><option value="خصم">خصم</option></select></div>
<div class="form-group"><label for="sizes">المقاسات مفصولة بفواصل</label><input type="text" id="sizes" required value="40, 41, 42, 43"></div>
<div class="form-group"><label for="description">وصف المنتج</label><textarea id="description" placeholder="اكتب وصف المنتج"></textarea></div>
<div class="form-group"><label for="imageFile">اختر صورة من الجهاز</label><input type="file" id="imageFile" accept="image/*"></div>
<div class="form-group"><label for="imageUrl">أو رابط الصورة</label><input type="url" id="imageUrl" placeholder="https://..."></div>
<button type="submit" class="btn-submit" id="submitBtn">حفظ ونشر المنتج</button></form></div></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
<script>
const form=document.getElementById('addProductForm'),btn=document.getElementById('submitBtn'),message=document.getElementById('message');
function showMessage(text,type='success'){message.textContent=text;message.className='message show '+type;setTimeout(()=>message.classList.remove('show'),5000)}
function categoryClass(category){return 'badge badge-'+String(category||'default').toLowerCase()}
async function loadAdminDashboard(){if(!window.supabaseClient){showMessage('تعذر الاتصال بـ Supabase','error');return}await fetchProductsFromSupabase();const tbody=document.getElementById('adminProductsList');tbody.innerHTML='';document.getElementById('statTotal').textContent=products.length;const categories=new Set(products.map(p=>p.category).filter(Boolean));document.getElementById('statCategories').textContent=categories.size||0;if(!products.length){tbody.innerHTML='<tr><td colspan="4" style="text-align:center">لا توجد منتجات</td></tr>';return}products.forEach(p=>{const tr=document.createElement('tr');tr.innerHTML=`<td><img src="${p.image||''}" class="product-img-mini" alt=""></td><td><strong>${escapeHTML(p.name)}</strong></td><td><span class="${categoryClass(p.category)}">${escapeHTML(p.category||'غير محدد')}</span></td><td>${p.price} ج.م</td>`;tbody.appendChild(tr)})}
form.addEventListener('submit',async e=>{e.preventDefault();if(!window.supabaseClient){showMessage('Supabase غير متصل','error');return}btn.disabled=true;btn.textContent='جاري الحفظ...';try{const file=document.getElementById('imageFile').files[0],url=document.getElementById('imageUrl').value.trim();let finalUrl=url;if(file){const safeName=file.name.replace(/[^a-zA-Z0-9._-]/g,'_');const fileName=`${Date.now()}_${safeName}`;const {error:uploadError}=await supabaseClient.storage.from('products').upload(fileName,file,{upsert:false});if(uploadError)throw uploadError;const {data}=supabaseClient.storage.from('products').getPublicUrl(fileName);finalUrl=data.publicUrl}if(!finalUrl)throw new Error('يرجى اختيار صورة أو إدخال رابط صورة');const sizes=document.getElementById('sizes').value.split(',').map(s=>s.trim()).filter(Boolean).map(s=>Number(s)).filter(Number.isFinite);if(!sizes.length)throw new Error('أدخل مقاسًا واحدًا على الأقل');await saveProductToSupabase({name:document.getElementById('name').value,category:document.getElementById('category').value,price:document.getElementById('price').value,oldPrice:document.getElementById('oldPrice').value,badge:document.getElementById('badge').value,sizes,image:finalUrl,description:document.getElementById('description').value});form.reset();document.getElementById('sizes').value='40, 41, 42, 43';showMessage('تمت إضافة المنتج بنجاح');await loadAdminDashboard()}catch(err){console.error(err);showMessage('حدث خطأ: '+err.message,'error')}finally{btn.disabled=false;btn.textContent='حفظ ونشر المنتج'}});
document.addEventListener('DOMContentLoaded',loadAdminDashboard);
</script></body></html>
