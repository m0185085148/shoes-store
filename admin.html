<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - STEP Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f4f6f9;
            --sidebar-bg: #111827;
            --card-bg: #ffffff;
            --accent-color: #2563eb;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --danger-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
        }

        /* القائمة الجانبية */
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            color: #fff;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
            gap: 32px;
        }

        .brand {
            font-size: 22px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #fff;
            text-decoration: none;
        }

        .nav-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-item a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            color: #9ca3af;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .nav-item.active a, .nav-item a:hover {
            background-color: #1f2937;
            color: #fff;
        }

        /* المحتوى الرئيسي */
        .main-content {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }

        .header h1 { font-size: 24px; font-weight: 700; }

        /* كروت الإحصائيات */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            background: #eff6ff;
            color: var(--accent-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .stat-data h3 { font-size: 22px; font-weight: bold; }
        .stat-data p { color: var(--text-muted); font-size: 14px; }

        /* أقسام المحتوى */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 24px;
        }

        @media (max-width: 1024px) {
            .dashboard-grid { grid-template-columns: 1fr; }
            body { flex-direction: column; }
            .sidebar { width: 100%; }
        }

        .panel {
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            padding: 24px;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .panel-title { font-size: 18px; font-weight: bold; }

        /* نموذج الإضافة */
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 500; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        .form-group input:focus { border-color: var(--accent-color); }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-submit:hover { background: #1d4ed8; }

        /* جدول المنتجات */
        .products-table {
            width: 100%;
            border-collapse: collapse;
        }
        .products-table th, .products-table td {
            padding: 12px;
            text-align: right;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }
        .products-table th { color: var(--text-muted); font-weight: 500; }
        .product-img-mini { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; }
        
        /* الشارة البيضاوية وتنسيق الألوان للأقسام الجديدة */
        .badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            display: inline-block;
        }
        .badge-casual { background-color: #e3f2fd; color: #0d47a1; }
        .badge-sports { background-color: #e8f5e9; color: #1b5e20; }
        .badge-classic { background-color: #fff3e0; color: #e65100; }
        .badge-slides { background-color: #f3e5f5; color: #4a148c; }

        /* تلوين خيارات القائمة المنسدلة */
        select#category option[value="Casual"] { background-color: #e3f2fd; color: #0d47a1; font-weight: bold; }
        select#category option[value="Sports"] { background-color: #e8f5e9; color: #1b5e20; font-weight: bold; }
        select#category option[value="Classic"] { background-color: #fff3e0; color: #e65100; font-weight: bold; }
        select#category option[value="Slides"] { background-color: #f3e5f5; color: #4a148c; font-weight: bold; }
    </style>
</head>
<body>

    <!-- القائمة الجانبية -->
    <aside class="sidebar">
        <a href="index.html" class="brand">
            <i class="fa-solid fa-shoe-prints"></i>
            STEP Admin
        </a>
        <ul class="nav-menu">
            <li class="nav-item active">
                <a href="#"><i class="fa-solid fa-chart-pie"></i> لوحة التحكم</a>
            </li>
            <li class="nav-item">
                <a href="index.html" target="_blank"><i class="fa-solid fa-store"></i> معاينة المتجر</a>
            </li>
        </ul>
    </aside>

    <!-- المحتوى الرئيسي -->
    <main class="main-content">
        <div class="header">
            <div>
                <h1>إدارة المنتجات 👟</h1>
                <p style="color: var(--text-muted); font-size: 14px; margin-top: 4px;">إضافة وتعديل معروضات المتجر مباشرة</p>
            </div>
        </div>

       <!-- كروت الإحصائيات -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon"><i class="fa-solid fa-boxes-stacked"></i></div>
                <div class="stat-data">
                    <h3 id="statTotal">0</h3>
                    <p>إجمالي المنتجات</p>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fa-solid fa-tags"></i></div>
                <div class="stat-data">
                    <h3 id="statCategories">4</h3>
                    <p>عدد الأقسام النشطة</p>
                </div>
            </div>
        </div>

        <!-- تقسيم الشاشة -->
        <div class="dashboard-grid">
            
            <!-- قائمة المنتجات الحالية -->
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">المنتجات المعروضة</span>
                </div>
                <table class="products-table">
                    <thead>
                        <tr>
                            <th>الصورة</th>
                            <th>الاسم</th>
                            <th>القسم</th>
                            <th>السعر</th>
                        </tr>
                    </thead>
                    <tbody id="adminProductsList">
                        <tr><td colspan="4" style="text-align: center;">جاري التحميل...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- نموذج إضافة منتج -->
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-title">إضافة صنف جديد</span>
                </div>
                <form id="addProductForm">
                    <div class="form-group">
                        <label>اسم الحذاء</label>
                        <input type="text" id="name" required placeholder="مثال: Nike Air Force">
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <div class="form-group" style="flex:1;">
                            <label>القسم</label>
                  <select id="category" required>
                             <option value="" disabled selected>اختر القسم</option>
                             <option value="Casual">Casual</option>
                             <option value="Sports">Sports</option>
                             <option value="Classic">Classic</option>
                             <option value="Slides">Slides</option>
                     </select>
</div>
                        <div class="form-group" style="flex:1;">
                            <label>السعر (ج.م)</label>
                            <input type="number" id="price" required placeholder="1200">
                        </div>
                    </div>
                    <div style="display: flex; gap: 10px;">
                        <div class="form-group" style="flex:1;">
                            <label>السعر القديم</label>
                            <input type="number" id="oldPrice" placeholder="1500">
                        </div>
                        <div class="form-group" style="flex:1;">
                            <label>الشارة</label>
                            <select id="badge">
                                <option value="">بدون</option>
                                <option value="جديد">جديد</option>
                                <option value="خصم">خصم</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>المقاسات (مفصولة بفواصل)</label>
                        <input type="text" id="sizes" required value="40, 41, 42, 43">
                    </div>
                    <div class="form-group">
                        <label>📸 اختر صورة من الجهاز</label>
                        <input type="file" id="imageFile" accept="image/*">
                    </div>
                    <div class="form-group">
                        <label>🔗 أوضع رابط الصورة مباشرة</label>
                        <input type="url" id="imageUrl" placeholder="https://...">
                    </div>
                    <button type="submit" class="btn-submit" id="submitBtn">حفظ ونشر المنتج</button>
                </form>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
    <script>
        // إحضار وتحديث إحصائيات وجدول المنتجات في لوحة التحكم
        async function loadAdminDashboard() {
            await fetchProductsFromSupabase();
            
            const tbody = document.getElementById('adminProductsList');
            tbody.innerHTML = '';

            document.getElementById('statTotal').textContent = products.length;
         
            products.forEach(p => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><img src="${p.image}" class="product-img-mini" alt=""></td>
                    <td><strong>${p.name}</strong></td>
                    <td><span class="badge badge-${p.category ? p.category.toLowerCase() : 'default'}">${p.category || 'غير محدد'}</span></td>                    <td>${p.price} ج.م</td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('addProductForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const fileInput = document.getElementById('imageFile');
            const urlInput = document.getElementById('imageUrl');
            let finalUrl = "";

            submitBtn.disabled = true;
            submitBtn.textContent = 'جاري الحفظ والرفع...';

            try {
                if (fileInput.files[0]) {
                    const file = fileInput.files[0];
                    const fileName = `${Date.now()}_${file.name}`;
                    const { data, error } = await supabaseClient.storage.from('products').upload(fileName, file);
                    if (error) throw error;
                    
                    const { data: urlData } = supabaseClient.storage.from('products').getPublicUrl(fileName);
                    finalUrl = urlData.publicUrl;
                } else if (urlInput.value) {
                    finalUrl = urlInput.value;
                } else {
                    alert("يرجى اختيار صورة أولاً!");
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'حفظ ونشر المنتج';
                    return;
                }

                const sizes = document.getElementById('sizes').value.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));

                await saveProductToSupabase({
                    name: document.getElementById('name').value,
                    category: document.getElementById('category').value,
                    price: document.getElementById('price').value,
                    oldPrice: document.getElementById('oldPrice').value || null,
                    badge: document.getElementById('badge').value || null,
                    sizes: sizes,
                    image: finalUrl
                });

                e.target.reset();
                await loadAdminDashboard();
            } catch (err) {
                alert("حدث خطأ أثناء الإضافة: " + err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'حفظ ونشر المنتج';
            }
        });

        document.addEventListener('DOMContentLoaded', loadAdminDashboard);
    </script>
</body>
</html>
