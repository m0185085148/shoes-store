<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طلباتي - STEP Store</title>
<link rel="stylesheet" href="account.css">
<link rel="stylesheet" href="login-theme.css">
<link rel="stylesheet" href="account-theme.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="steps.css">
</head>
<body data-screen="orders">

<div class="top-announcement">
  <i class="fa-solid fa-truck-fast"></i>
  توصيل داخل القاهرة والجيزة، الشحن 80 جنيه ثابت لكل طلب
</div>

<header class="header">
  <div class="container header-content">
    <a href="index.html" class="logo">STEP</a>
    <nav class="main-nav">
      <a href="index.html">الرئيسية</a>
      <a href="index.html#productsSection">الأحذية</a>
    </nav>
    <div class="header-actions">
      <a href="index.html#productsSection" class="icon-button" title="المتجر">
        <i class="fa-solid fa-bag-shopping"></i>
      </a>
    </div>
  </div>
</header>

<main class="account-wrapper">
  <div class="container">

    <!-- HEADER CARD -->
    <div class="account-header-card">
      <div class="account-greeting">
        <div class="account-avatar" id="userAvatar">؟</div>
        <div>
          <h1 id="userGreeting">مرحباً بيك</h1>
          <p id="userEmail">-</p>
        </div>
      </div>
      <button class="logout-btn" id="logoutBtn" type="button">
        <i class="fa-solid fa-right-from-bracket"></i>
        تسجيل الخروج
      </button>
    </div>

    <div class="account-layout">
    <aside class="account-side" id="accountSide" aria-label="قائمة الحساب"></aside>
    <div class="account-content">

    <!-- ORDERS TAB -->
    <div class="tab-panel active" id="tabOrders">
      <div class="info-card">
        <div class="orders-header">
          <h2>
            <i class="fa-solid fa-box"></i>
            طلباتي
          </h2>
          <span class="orders-count-badge" id="ordersCount">0</span>
        </div>

        <div class="orders-filters" id="ordersFilters">
          <button type="button" class="orders-filter active" data-filter="all">الكل</button>
          <button type="button" class="orders-filter" data-filter="active">جارية</button>
          <button type="button" class="orders-filter" data-filter="delivered">تم التوصيل</button>
          <button type="button" class="orders-filter" data-filter="cancelled">ملغاة</button>
        </div>

        <div id="ordersList">
          <div class="account-empty">
            <i class="fa-solid fa-spinner fa-spin"></i>
            <p>جاري تحميل الطلبات...</p>
          </div>
        </div>
      </div>

      <div class="info-card claim-card">
        <h2><i class="fa-solid fa-link"></i> اربط طلباتك القديمة</h2>
        <div id="claimBox"></div>
      </div>
    </div>

    </div>
    </div>

  </div>
</main>

<footer class="footer">
  <div class="container footer-content">
    <div>
      <div class="footer-logo">STEP</div>
      <p>متجر أحذية عصرية.</p>
    </div>
    <div class="footer-links">
      <a href="index.html">الرئيسية</a>
      <a href="index.html#productsSection">الأحذية</a>
    </div>
  </div>
  <div class="container footer-bottom">
    <p>© 2026 STEP. جميع الحقوق محفوظة.</p>
  </div>
</footer>

<!-- ORDER DETAILS MODAL -->
<div class="order-details-modal" id="orderDetailsModal">
  <div class="order-details-content">
    <div class="order-details-header">
      <h2 id="orderDetailsTitle">تفاصيل الطلب</h2>
      <button class="order-details-close" id="closeOrderDetailsBtn" type="button">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div class="order-details-body" id="orderDetailsBody"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="account-shell.js"></script>
<script src="account.js"></script>
<script src="account-claims.js"></script>
</body>
</html>
