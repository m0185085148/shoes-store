<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - إضافة منتج جديد</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container {
            max-width: 600px;
            margin: 40px auto;
            padding: 25px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        .upload-option {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            border: 1px dashed #bbb;
            margin-bottom: 15px;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #000;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        .submit-btn:hover {
            background: #333;
        }
        .submit-btn:disabled {
            background: #888;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <h2>إضافة حذاء جديد للمتجر 👟</h2>
        <form id="addProductForm">
            <div class="form-group">
                <label>اسم الحذاء:</label>
                <input type="text" id="name" required placeholder="مثال: Air Max Black">
            </div>

            <div class="form-group">
                <label>القسم:</label>
                <select id="category" required>
                    <option value="رجالي">رجالي</option>
                    <option value="حريمي">حريمي</option>
                </select>
            </div>

            <div class="form-group">
                <label>السعر (جنيه):</label>
                <input type="number" id="price" required placeholder="1200">
            </div>

            <div class="form-group">
                <label>السعر القديم (اختياري للخصم):</label>
                <input type="number" id="oldPrice" placeholder="1500">
            </div>

            <div class="form-group">
                <label>الشارة / البادج (اختياري):</label>
                <select id="badge">
                    <option value="">بدون شارة</option>
                    <option value="جديد">جديد</option>
                    <option value="خصم">خصم</option>
                </select>
            </div>

            <div class="form-group">
                <label>المقاسات المتاحة (مفصولة بفواصل):</label>
                <input type="text" id="sizes" required value="40, 41, 42, 43, 44">
            </div>

            <!-- خيارات إضافة صورة الحذاء -->
            <div class="upload-option">
                <div class="form-group">
                    <label>📸 رفع صورة من الجهاز:</label>
                    <input type="file" id="imageFile" accept="image/*">
                </div>
                <p style="text-align: center; margin: 5px 0; color: #777;">— أو —</p>
                <div class="form-group">
                    <label>🔗 رابط صورة مباشر (URL):</label>
                    <input type="url" id="imageUrl" placeholder="https://example.com/shoe.jpg">
                </div>
            </div>

            <div class="form-group">
                <label>الوصف (اختياري):</label>
                <textarea id="description" rows="3" placeholder="وصف قصير للحذاء..."></textarea>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">حفظ المنتج في المتجر</button>
        </form>
    </div>

    <!-- ربط مكتبة Supabase وملف الـ JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
    <script>
        document.getElementById('addProductForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const submitBtn = document.getElementById('submitBtn');
            const imageFileInput = document.getElementById('imageFile');
            const imageUrlInput = document.getElementById('imageUrl');

            let finalImageUrl = "";

            submitBtn.textContent = 'جاري رفع الصورة والبيانات...';
            submitBtn.disabled = true;

            try {
                // 1. في حال اختيار صورة من الجهاز
                if (imageFileInput.files && imageFileInput.files[0]) {
                    const file = imageFileInput.files[0];
                    const fileExt = file.name.split('.').pop();
                    const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;

                    const { data: uploadData, error: uploadError } = await supabaseClient.storage
                        .from('products')
                        .upload(fileName, file);

                    if (uploadError) {
                        alert("حدث خطأ أثناء رفع الصورة للجهاز: " + uploadError.message);
                        submitBtn.textContent = 'حفظ المنتج في المتجر';
                        submitBtn.disabled = false;
                        return;
                    }

                    // الحصول على الرابط العام للصورة المرفوعة
                    const { data: publicUrlData } = supabaseClient.storage
                        .from('products')
                        .getPublicUrl(fileName);

                    finalImageUrl = publicUrlData.publicUrl;

                } else if (imageUrlInput.value.trim() !== "") {
                    // 2. في حال إدخال رابط مباشر
                    finalImageUrl = imageUrlInput.value.trim();
                } else {
                    alert("يرجى اختيار صورة من الجهاز أو وضع رابط صورة مباشر!");
                    submitBtn.textContent = 'حفظ المنتج في المتجر';
                    submitBtn.disabled = false;
                    return;
                }

                // تحويل نص المقاسات إلى مصفوفة أرقام
                const sizesInput = document.getElementById('sizes').value;
                const sizesArray = sizesInput.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));

                const productData = {
                    name: document.getElementById('name').value,
                    category: document.getElementById('category').value,
                    price: document.getElementById('price').value,
                    oldPrice: document.getElementById('oldPrice').value || null,
                    badge: document.getElementById('badge').value || null,
                    sizes: sizesArray,
                    image: finalImageUrl,
                    description: document.getElementById('description').value || ""
                };

                await saveProductToSupabase(productData);
                e.target.reset(); // إعادت تعيين النموذج

            } catch (err) {
                console.error(err);
                alert("حدث خطأ غير متوقع!");
            } finally {
                submitBtn.textContent = 'حفظ المنتج في المتجر';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
