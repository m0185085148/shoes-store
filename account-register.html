<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حساب - STEP Store</title>
<link rel="stylesheet" href="account.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div class="top-announcement">
  <i class="fa-solid fa-truck-fast"></i>
  شحن مجاني عند شراء قطعتين أو أكثر 🎉
</div>

<header class="header">
  <div class="container header-content">
    <a href="index.html" class="logo">STEP</a>
    <nav class="main-nav">
      <a href="index.html">الرئيسية</a>
      <a href="index.html#products">الأحذية</a>
    </nav>
    <div class="header-actions">
      <a href="index.html" class="icon-button" title="الرئيسية">
        <i class="fa-solid fa-house"></i>
      </a>
    </div>
  </div>
</header>

<main class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="auth-icon">
        <i class="fa-solid fa-user-plus"></i>
      </div>
      <h1>إنشاء حساب جديد</h1>
      <p>انضم لعائلة STEP واستمتع بتجربة تسوق أسهل</p>
    </div>

    <div id="registerMessage" class="auth-message"></div>

    <form id="registerForm" class="auth-form">
      <div class="form-group">
        <label for="fullName">الاسم بالكامل *</label>
        <div class="input-icon-wrapper">
          <i class="fa-solid fa-user"></i>
          <input type="text" id="fullName" required placeholder="مثال: أحمد محمد" minlength="3">
        </div>
      </div>

      <div class="form-group">
        <label for="phone">رقم الهاتف *</label>
        <div class="input-icon-wrapper">
          <i class="fa-solid fa-phone"></i>
          <input type="tel" id="phone" required placeholder="01xxxxxxxxx" pattern="01[0-9]{9}">
        </div>
      </div>

      <div class="form-group">
        <label for="email">البريد الإلكتروني *</label>
        <div class="input-icon-wrapper">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="email" required placeholder="you@example.com" autocomplete="email">
        </div>
      </div>

      <div class="form-group">
        <label for="password">كلمة المرور *</label>
        <div class="input-icon-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="password" required placeholder="6 أحرف على الأقل" minlength="6" autocomplete="new-password">
          <button type="button" class="password-toggle" id="passwordToggle" aria-label="إظهار كلمة المرور">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">تأكيد كلمة المرور *</label>
        <div class="input-icon-wrapper">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="confirmPassword" required placeholder="أعد كتابة كلمة المرور" minlength="6" autocomplete="new-password">
        </div>
      </div>

      <button type="submit" class="btn-primary" id="registerBtn">
        <i class="fa-solid fa-user-plus"></i>
        إنشاء الحساب
      </button>
    </form>

    <!-- ✅ فاصل -->
    <div style="display:flex;align-items:center;gap:12px;margin:22px 0;">
      <div style="flex:1;height:1px;background:#e5e5e5;"></div>
      <span style="color:#999;font-size:13px;">أو</span>
      <div style="flex:1;height:1px;background:#e5e5e5;"></div>
    </div>

    <!-- ✅ زر Google -->
    <button type="button" class="btn-google" onclick="signInWithGoogle()">
      <svg width="18" height="18" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
        <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
        <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
        <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
      </svg>
      التسجيل بـ Google
    </button>

    <div class="auth-footer">
      عندك حساب بالفعل؟
      <a href="account-login.html">تسجيل الدخول</a>
    </div>

    <a href="index.html" class="back-link">
      <i class="fa-solid fa-arrow-right"></i>
      العودة للمتجر
    </a>
  </div>
</main>

<footer class="footer">
  <div class="container footer-content">
    <div>
      <div class="footer-logo">STEP</div>
      <p>متجر أحذية عصرية.</p>
    </div>
    <div class="footer-links">
      <a href="index.html">الرئيسية</a>
      <a href="index.html#products">الأحذية</a>
    </div>
  </div>
  <div class="container footer-bottom">
    <p>© 2026 STEP. جميع الحقوق محفوظة.</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="account.js"></script>
</body>
</html>
